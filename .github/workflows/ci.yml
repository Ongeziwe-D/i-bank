name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  docker:
    name: Docker image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t i-bank:ci .
      - name: Smoke test
        run: |
          docker run -d --name i-bank -p 8080:8080 i-bank:ci
          for _ in $(seq 1 20); do curl -fsS http://localhost:8080/ > /dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<app-root>'
          curl -fsSI http://localhost:8080/ | grep -qi 'content-security-policy'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health)" = 503
      - name: Container logs
        if: always()
        run: docker logs i-bank || true

  e2e:
    name: End-to-end tests (demo image)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - run: npm run e2e:typecheck
      - run: npx playwright install --with-deps chromium
      - name: Start demo container
        run: |
          docker build --build-arg BUILD_CONFIGURATION=demo -t i-bank:demo .
          docker run -d --name i-bank-demo -p 8080:8080 i-bank:demo
          for _ in $(seq 1 20); do curl -fsS http://localhost:8080/ > /dev/null && break; sleep 1; done
      - run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
