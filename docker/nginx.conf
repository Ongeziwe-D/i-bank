server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Everything (scripts, styles, fonts, API) is served from this origin. Angular injects component
  # styles at runtime, which is why styles need 'unsafe-inline'; scripts do not.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  # Browsers only honour HSTS over HTTPS, so this takes effect once TLS is terminated in front.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # Written at container start from API_UPSTREAM by /docker-entrypoint.d/40-api-proxy.sh.
  include /etc/nginx/api-proxy.inc;

  # Hashed bundles and fonts never change, so browsers can keep them.
  location ~ "-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?)$" {
    expires 1y;
    try_files $uri =404;
  }

  # Everything else, including index.html, is checked on each visit so new releases show up.
  # Unknown paths fall back to index.html so the Angular router can handle them.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
