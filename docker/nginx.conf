server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Written at container start from API_UPSTREAM by /docker-entrypoint.d/40-api-proxy.sh.
  include /etc/nginx/api-proxy.inc;

  # Hashed bundles never change, so browsers can keep them.
  location ~ "-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
    expires 1y;
    try_files $uri =404;
  }

  # Everything else, including index.html, is checked on each visit so new releases show up.
  # Unknown paths fall back to index.html so the Angular router can handle them.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
